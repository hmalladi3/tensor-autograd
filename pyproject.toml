[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tensor-autograd"
version = "0.1.0"
description = "A zero-dependency deep learning framework built from scratch in C++ and Python."
requires-python = ">=3.10"
dependencies = []

[tool.setuptools]
packages = ["tensor_autograd", "tensor_autograd.nn"]
include-package-data = true

[tool.setuptools.package-data]
tensor_autograd = ["*.so", "*.dylib", "*.dll"]
